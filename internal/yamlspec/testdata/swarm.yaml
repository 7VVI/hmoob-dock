version: "3.8"
services:
  api:
    image: nginx:1.27-alpine
    command: ["nginx", "-g", "daemon off;"]
    environment:
      LOG_LEVEL: info
    ports:
      - "8080:80"
    volumes:
      - api-data:/var/lib/api
    networks:
      - demo
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      app: demo
    deploy:
      replicas: 2
      mode: replicated
      placement:
        constraints:
          - node.labels.role == app
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
volumes:
  api-data:
networks:
  demo:
