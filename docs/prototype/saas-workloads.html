function deploy(a){if(!canDeploy(a))return;const versionID='v-demo-'+String(++counter).padStart(3,'0');const task={id:'task-demo-'+counter,state:'queued',at:stamp(),output:'[模拟] 部署已排队。',partial:false,rolledBack:false};a.task=a.selectedTask=task;a.latest=versionID;a.saved=a.draft;a.savedVariables={...a.variables};a.loadedVersion='';const version={id:versionID,at:stamp(),yaml:a.draft,variables:{...a.variables},taskID:task.id,state:'queued'};a.versions.unshift(version);a.preview=null;const outcome=state.nextResult;state.previewDanger=false;toast('部署已提交（模拟），不会操作真实容器。');render();['preflight','running','verifying',outcome].forEach((phase,i)=>{const timer=setTimeout(()=>{task.state=version.state=phase;task.output+='\n'+(phase==='running'?'Container '+a.namespace+'-1 Recreate':phase==='succeeded'?'Container '+a.namespace+'-1 Started\n服务已达到目标状态。':taskNames[phase]);if(phase==='succeeded'){a.successful=versionID;syncSimulatedContainers(a,version);task.output+='\n'+containers.filter(c=>c.node===a.target&&c.namespace===a.namespace).map(c=>'Container '+c.name+' Started').join('\n')}if(state.auth==='signed-in' && state.route==='detail'&&state.appID===a.id){if(state.tab==='config'){updateConfigHint(a);const status=$('[data-task-status]');if(status)status.textContent=taskNames[phase]}else render()}if(i===3){jobTimers=jobTimers.filter(j=>j.app!==a.id);if(state.auth==='signed-in')render()}},650*(i+1));jobTimers.push({app:a.id,timer})})}
function stopLogs(){if(logTimer)clearInterval(logTimer);logTimer=null;logOpened=false;following=true}
function startLogs(){
 if(logOpened)return;const selection=inspectorSelection();if(!selection)return;const {c}=selection;
 if(!connected(nodes.find(n=>n.id===c.node))){toast('连接中断，暂时无法打开容器实时日志。');return}
 logOpened=true;following=true;
 const content=c.service==='mysql'?'Database ready for connections':c.service==='redis'?'Ready to accept connections':c.service==='worker'?'Job processed successfully':'GET /health HTTP/1.1 200';
 logLines=Array.from({length:24},(_,i)=>`[模拟] ${new Date().toISOString()} [${c.name}] ${content} · ${i+1}`);
 if(c.status!=='running')logLines.push(`[模拟] [${c.name}] process exited; no further output.`);
 else logTimer=setInterval(()=>{
  if(inspectorSelection()?.c.id!==c.id||inspectorState?.tab!=='logs'){stopLogs();return}
  logLines.push(`[模拟] ${new Date().toISOString()} [${c.name}] ${content}`);
  if(logLines.length>5000){logLines=logLines.slice(-5000);state.logGap=true}
  const box=$('[data-live-log]');if(box){box.textContent=logLines.map(x=>x.length>2000?x.slice(0,2000)+'…（本行过长，已截断）':x).join('\n');if(following)box.scrollTop=box.scrollHeight}
 },950);
 renderInspector();
}

function validCIDR(entry){const [ip,prefix,...rest]=entry.split('/');if(rest.length||!/^\d+$/.test(prefix||''))return false;const n=Number(prefix);if(ip.includes(':')){if(!/^[0-9a-f:.]+$/i.test(ip)||n>128)return false;try{return new URL('https://['+ip+']/').hostname.startsWith('[')}catch{return false}}const parts=ip.split('.');return parts.length===4&&parts.every(p=>/^\d{1,3}$/.test(p)&&Number(p)<=255)&&n<=32}
const initial=location.hash.slice(1).split('/');if(['overview','applications','alerts','settings'].includes(initial[0]))state.route=initial[0];if(initial[0]==='applications'&&initial[1]&&applications.some(a=>a.id===initial[1])){state.route='detail';state.appID=initial[1];state.tab=['overview','containers','logs','config','history'].includes(initial[2])?initial[2]:'containers'}if(initial[0]==='nodes'){if(initial[1]&&nodes.some(n=>n.id===initial[1])){state.route='node';state.nodeID=initial[1]}else state.route='nodes';state.nodeTab=['managed','unmanaged','curve'].includes(initial[2])?initial[2]:'managed'}if(!location.hash){state.route='detail';state.tab='containers'}
render();
