function nav(route,appID,tab){stopLogs();hideToken(false);state.route=route;if(appID)state.appID=appID;if(tab)state.tab=tab;state.error=false;state.loading=false;history.replaceState(null,'','#'+(route==='detail'?`applications/${state.appID}/${state.tab}`:route));render();window.scrollTo({top:0,behavior:'instant'});$('main h1')?.focus({preventScroll:true})}

  if(state.error)return header('读取失败','输入和编辑内容均已保留。')+notice('数据读取失败，请重试。此状态仅用于演示。','bad',btn('重试','retry'));

function nodeRows(manage=false){return nodes.map(n=>`<tr><td><strong>${esc(n.name)}</strong><span class="sub mono">${esc(n.id)}</span></td><td>${pill(n.revoked?'已撤销':connected(n)?'已连接':'连接中断',connected(n)?'ok':'warn')}</td><td class="mono">${containers.filter(c=>c.node===n.id).length}</td><td class="mono">${esc(n.last)}</td><td class="actions">${manage?btn('撤销接入','revoke','quiet',`data-id="${n.id}" ${n.revoked?'disabled':''}`):btn('查看资源曲线','node-curve','quiet',`data-id="${n.id}"`)}</td></tr>`).join('')}
function overview(){
 const visibleNodes=state.empty?[]:nodes;
 return header('概览','集中查看节点连接与容器资源，快速定位需要关注的变化。',btn(icon('refresh')+'刷新','refresh'))+
 `<div class="summary"><div><span>已接入节点</span><strong>${visibleNodes.length}</strong><small>${visibleNodes.filter(connected).length} 个已连接</small></div><div><span>容器</span><strong>${state.empty?0:containers.length}</strong><small>${state.empty?0:containers.filter(c=>c.status==='running').length} 个运行中</small></div><div><span>当前异常</span><strong>${state.empty?0:events.filter(e=>!e.ack&&!e.resolved).length}</strong><small>确认不等于恢复</small></div></div>`+
 card('节点','来自最近一次上报的清单',visibleNodes.length?table('节点列表',['主机名','连接状态','容器','最近活动','操作'],nodeRows()):empty('还没有接入节点','前往设置生成一次性令牌，接入第一个节点。',btn('接入节点','to-enroll','primary')))+
 card('资源曲线','容器级指标 · 保留最近 24 小时',`<div class="card-body">${monitor()}</div>`);
}
function monitor(a=null){
 const list=appContainers(a);if(!list.some(c=>c.id===state.containerID))state.containerID=list.find(c=>c.status==='running')?.id || list[0]?.id || '';
 const target=a?nodes.find(n=>n.id===a.target):nodes.find(n=>n.id===state.nodeID);
 const offline=target&&!connected(target);const metric=metrics.find(m=>m[0]===state.metric);
 const controls=`<div class="toolbar">${a?'':selectField('节点','curve-node',state.empty?[]:nodes.map(n=>[n.id,n.name]),state.nodeID)}${selectField('容器','curve-container',list.length?list.map(c=>[c.id,c.name+' · '+c.status]):[['','暂无容器']],state.containerID,list.length?'':'disabled')}${selectField('监控指标','curve-metric',metrics.map(m=>[m[0],m[1]]),state.metric)}${selectField('时间范围','curve-range',[['60','最近 1 小时'],['360','最近 6 小时'],['1440','最近 24 小时']],state.range)}${btn('查看曲线','curve','primary',list.length?'':'disabled')}</div>`;
 const warning=offline?notice('连接中断。曲线停在最后一次收到数据的时候，不代表机器已经宕机。','warn'):state.stale?notice('数据已过期。最后一次采样来自 '+esc(stamp(-600000))+'，请检查节点连接。','warn'):'';
 if(!list.length)return controls+empty('暂无容器数据','接入节点并运行容器后，即可查看资源使用情况。');
 if(!state.curve)return controls+warning+empty('选择容器和指标','点击「查看曲线」读取历史数据。');
 const container=list.find(c=>c.id===state.containerID);
 return controls+warning+`<div class="row between" style="margin-bottom:18px"><h3 data-chart-title>${esc(container.name)} · ${metric[1]}</h3><span class="small muted">${state.range==='60'?'最近 1 小时':state.range==='360'?'最近 6 小时':'最近 24 小时'} · 模拟数据</span></div>${container.status!=='running'?notice('容器已停止。以下为停止前的历史数据，不表示当前仍有资源消耗。'):''}<div class="chart-stats"><span>最近一分钟平均<b data-reading="current"></b></span><span>区间平均<b data-reading="avg"></b></span><span>区间峰值<b data-reading="peak"></b></span><span>有效采样点<b data-reading="count"></b></span></div><figure class="chart-wrap"><svg data-chart role="img" aria-label="${esc(metric[1])}平均与峰值曲线"></svg><figcaption class="chart-note"><div class="legend"><span><i></i>分钟平均</span><span><i class="peak"></i>分钟峰值</span></div><p style="margin-top:8px">每 10 秒采样，按分钟聚合；数据缺口留空，不记为零。CPU 每核 100%。</p></figcaption></figure>`;
}
function drawCharts(){document.querySelectorAll('[data-chart]').forEach(svg=>{
 const m=metrics.find(x=>x[0]===state.metric),w=Math.max(240,svg.getBoundingClientRect().width),h=220,left=43,right=12,top=14,bottom=27;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
 const base=[12,16,14,11,17,20,18,24,19,15,17,18,27,34,29,20,18,16,15,13,14,12,14,12];const factor=m[3]/100;const vals=base.map((v,i)=>((state.containerID.length%4)+v+(Number(state.range)/360)*(i%3))*factor);const peaks=vals.map(v=>v*1.24);const x=i=>left+i*(w-left-right)/23,y=v=>h-bottom-v/m[3]*(h-top-bottom);let content='';
 for(let i=0;i<5;i++){let v=m[3]*i/4;content+=`<line x1="${left}" y1="${y(v)}" x2="${w-right}" y2="${y(v)}" stroke="#eef0f4"/><text x="${left-8}" y="${y(v)+4}" text-anchor="end" fill="#667085" font-size="10" font-family="Consolas,monospace">${v}</text>`}
 [0,8,16,23].forEach(i=>{const date=new Date(Date.now()-(23-i)*Number(state.range)*60000/23);content+=`<text x="${x(i)}" y="${h-6}" text-anchor="${i===23?'end':i===0?'start':'middle'}" fill="#667085" font-size="10">${date.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}</text>`});
 const draw=(arr,color,dashed=false)=>{let d='',gap=true;arr.forEach((v,i)=>{if(state.metricGap && (i===11||i===12)){gap=true;return}d+=`${gap?'M':'L'}${x(i)},${y(v)} `;gap=false});return `<path d="${d}" fill="none" stroke="${color}" stroke-width="${dashed?1.5:2}" ${dashed?'stroke-dasharray="4 4"':''} stroke-linejoin="round"/>`};content+=draw(peaks,'#98a2b3',true)+draw(vals,'#4f46e5');svg.innerHTML=content;
 const section=svg.closest('.card-body');const format=v=>v.toFixed(1)+' '+m[2];const valid=vals.filter((v,i)=>!state.metricGap||(i!==11&&i!==12));const validPeaks=peaks.filter((v,i)=>!state.metricGap||(i!==11&&i!==12));section.querySelector('[data-reading=current]').textContent=format(vals.at(-1));section.querySelector('[data-reading=avg]').textContent=format(valid.reduce((a,b)=>a+b,0)/valid.length);section.querySelector('[data-reading=peak]').textContent=format(Math.max(...validPeaks));section.querySelector('[data-reading=count]').textContent=valid.length+' / 24';
 })}
function appList(){return header('应用','管理 Compose 项目与 Swarm Stack，预览变更后再发布。',btn(icon('plus')+'新建应用','create-app','primary'))+card('全部应用',(state.empty?0:applications.length)+' 个应用',state.empty?empty('还没有应用','新建应用后编写配置，预览影响并部署。',btn('新建应用','create-app','primary')):table('应用列表',['名称','模式','命名空间','目标','操作'],applications.map(a=>`<tr><td><a href="#applications/${esc(a.id)}" data-action="open-app" data-id="${esc(a.id)}"><strong>${esc(a.name)}</strong></a></td><td>${a.mode==='swarm'?'Swarm':'Compose'}</td><td class="mono">${esc(a.namespace)}</td><td>${esc(nodeName(a.target))}</td><td class="actions">${btn('打开','open-app','quiet',`data-id="${esc(a.id)}"`)}</td></tr>`).join('')),btn('刷新','refresh','compact'))}
function taskCard(a){const t=a.task;if(!t)return '';const tone=t.state==='succeeded'?'ok':t.state==='failed'?'bad':t.state==='uncertain'?'warn':'progress';return `<section class="card" style="margin-bottom:24px"><div class="task-strip"><span class="pill ${tone}" data-task-status>${taskNames[t.state]}</span><span class="small muted mono">${esc(t.id)}</span>${t.partial?pill('部分更新','warn'):''}${t.rolledBack?pill('目标已回滚','warn'):''}${btn('查看部署输出','task-output','quiet compact','style="margin-left:auto"')}</div>${['queued','preflight','running','verifying'].includes(t.state)?`<div class="steps">${['queued','preflight','running','verifying'].map((s,i)=>`<span class="${s===t.state?'current':i<['queued','preflight','running','verifying'].indexOf(t.state)?'done':''}">${taskNames[s]}</span>`).join('')}</div>`:''}${t.state==='uncertain'?`<div class="card-body" style="padding-top:0">${notice('结果未知，平台无法证明执行端已停止。核对完成前，这个应用不能提交新的部署。','warn',btn('重新核对','reconcile')+btn('人工核对并释放','resolve','danger'))}</div>`:''}${t.partial?'<div class="card-foot small muted">只有部分服务达到目标状态，请检查部署输出。</div>':''}${t.rolledBack?'<div class="card-foot small muted">目标已回到本次部署前的状态，不代表恢复了已删除的数据。</div>':''}</section>`}
function appDetail(){const a=currentApp();if(!a)return header('应用不存在','请返回应用列表。',btn('返回应用','to-apps'));return header(a.name,`${a.mode==='swarm'?'Swarm Stack':'Compose 项目'} · ${esc(a.namespace)} · ${esc(nodeName(a.target))}`,btn('重新加载','reload-config'),'<a href="#applications" data-action="to-apps">应用</a> / '+esc(a.name))+taskCard(a)+tabs([['overview','概况'],['containers','容器'],['logs','部署输出'],['config','配置'],['history','部署记录']],state.tab,'app-tab','应用详情')+({overview:()=>appOverview(a),containers:()=>containerPage(a),logs:()=>outputPage(a),config:()=>configPage(a),history:()=>historyPage(a)}[state.tab]||(()=>appOverview(a)))()}

function configPage(a){return card('配置','编辑 YAML 与变量，先预览，再保存并部署。',`<div class="card-body">${a.loadedVersion?notice('已载入历史版本 <code>'+esc(a.loadedVersion)+'</code>。重新部署不会恢复已经删除的数据；请确认影响后提交。','warn'):''}${a.conflict?notice('服务端配置已更新。本页面的编辑仍然保留，请比较后选择。','warn',btn('使用服务端配置','use-server')+btn('保留我的编辑','keep-draft','quiet')):''}<div class="editor-head"><span class="mono">${a.mode==='swarm'?'stack.yml':'compose.yml'}</span><span class="small muted" data-dirty>${a.draft!==a.saved?'未保存的编辑':'与最近提交一致'}</span></div><div class="editor"><div class="line-numbers" aria-hidden="true">${a.draft.split('\n').map((_,i)=>i+1).join('\n')}</div><textarea id="yaml" aria-label="YAML 配置" spellcheck="false">${esc(a.draft)}</textarea></div><div class="config-section"><h3>环境变量</h3><p class="small muted">值只在内存中保存，页面只显示设置状态。留空不覆盖旧值。</p><div class="variables">${Object.keys(a.variables).length?Object.keys(a.variables).sort().map(name=>`<div class="variable"><code>${esc(name)}</code><span class="small muted">${a.variables[name]?'已设置':'未设置'}</span><input type="password" autocomplete="off" aria-label="${esc(name)} 的新值" placeholder="新的值（留空保持不变）" data-variable="${esc(name)}">${btn('删除','remove-variable','quiet compact',`data-name="${esc(name)}" aria-label="删除变量 ${esc(name)}"`)}</div>`).join(''):'<p class="small muted">这个应用还没有变量。</p>'}</div><div class="row">${field('变量名','var-name')}${field('变量值','var-value','','password')}${btn('添加变量','add-variable','','style="align-self:end"')}</div><div id="variable-error"></div></div><div class="config-section"><h3>影响预览</h3><p class="small muted">原型演示校验与确认交互；完整 YAML 语义及安全校验由正式后端执行。</p><div class="row" style="margin:16px 0">${btn('预览影响','preview')}</div><div id="preview-result">${previewMarkup(a)}</div></div></div><div class="card-foot"><span class="small muted" data-submit-hint>${submitHint(a)}</span>${btn('保存并部署','deploy','primary',`id="deploy-button" style="margin-left:auto" ${canDeploy(a)?'':'disabled'}`)}</div>`)}
function previewMarkup(a){const p=a.preview;if(!p)return '';if(p.error)return notice(esc(p.error),'bad');return `${p.removed.length?notice('这次部署会删除以下服务：<ul>'+p.removed.map(n=>`<li><code>${esc(n)}</code></li>`).join('')+'</ul><label class="check"><input type="checkbox" id="confirm-removal" '+(a.removal?'checked':'')+'>我确认删除这些服务</label>','warn'):''}${p.risks.length?notice('<strong>需要确认的风险</strong><ul>'+p.risks.map(r=>`<li>${esc(r)}</li>`).join('')+'</ul><label class="check"><input type="checkbox" id="confirm-risk" '+(a.risk?'checked':'')+'>我已知晓这些风险</label>','warn'):''}${p.removed.length||p.risks.length?'':notice('预览通过：不会删除服务，也没有风险提示。')}<p class="small muted">目标 ${esc(nodeName(a.target))} · 预览仅对应当前配置与变量。</p>`}
function canDeploy(a){return !!(a.preview&&!a.preview.error&&a.preview.fingerprint===fingerprint(a)&&(!a.preview.removed.length||a.removal)&&(!a.preview.risks.length||a.risk)&&!blocking(a.task)&&!a.conflict)}
function submitHint(a){if(blocking(a.task))return '当前部署尚未结束，不能重复提交。';if(a.conflict)return '先处理服务端配置冲突。';if(!a.preview||a.preview.error)return '请先预览影响。';if(a.preview.fingerprint!==fingerprint(a))return '配置已变化，请重新预览。';if(!canDeploy(a))return '请确认服务删除与风险。';return '保存配置后将立即发起部署。'}
function updateConfigHint(a){const b=$('#deploy-button');if(b)b.disabled=!canDeploy(a);if($('[data-submit-hint]'))$('[data-submit-hint]').textContent=submitHint(a);if($('[data-dirty]'))$('[data-dirty]').textContent=a.draft===a.saved?'与最近提交一致':'未保存的编辑'}
function historyPage(a){return card('部署记录','重新部署只恢复配置，不会恢复已经删除的数据。',a.versions.length?table('版本记录',['提交时间','版本','标记','操作'],a.versions.map(v=>`<tr><td class="mono">${esc(v.at)}</td><td class="mono">${esc(v.id)}</td><td>${v.id===a.latest?'<span class="badge">最近提交</span> ':''}${v.id===a.successful?'<span class="badge">最近成功</span>':''}</td><td class="actions">${btn('查看输出','version-output','quiet compact',`data-id="${esc(v.id)}"`)}${btn('重新部署此版本','redeploy','quiet compact',`data-id="${esc(v.id)}" ${blocking(a.task)?'disabled':''}`)}</td></tr>`).join('')):empty('尚无部署记录','在配置页预览影响并提交第一次部署。',btn('编写配置','config-tab','primary')))}
function alertsPage(){return header('告警','区分当前异常、已确认与已恢复，按需配置规则和通知。',btn('刷新','refresh'))+tabs([['events','异常事件'],['rules','告警规则'],['notifications','通知设置']],state.alertTab,'alert-tab','告警管理')+(state.alertTab==='events'?eventPage():state.alertTab==='rules'?rulePage():notificationPage())}
function eventPage(){const groups={active:events.filter(e=>!e.resolved&&!e.ack),acknowledged:events.filter(e=>e.ack),resolved:events.filter(e=>e.resolved&&!e.ack)};const list=state.empty?[]:groups[state.filter];return card('异常事件','确认只标记为已读，不会把异常变为恢复。',`<div class="card-body"><div class="subtabs" role="tablist" aria-label="异常状态">${[['active','当前异常'],['acknowledged','已确认'],['resolved','已恢复']].map(([k,v])=>`<button role="tab" aria-selected="${state.filter===k}" data-action="event-filter" data-id="${k}">${v} (${state.empty?0:groups[k].length})</button>`).join('')}</div><div data-events>${list.length?list.map(e=>`<article class="event"><div><div class="row"><h3>${esc(e.summary)}</h3>${pill(e.resolved?'已恢复':e.ack?'仍未恢复':'当前异常',e.resolved?'ok':'warn')}</div><p>对象 <code>${esc(objectName(e.object))}</code> · 规则 <code>${esc(e.rule)}</code></p><p>开始于 ${esc(e.at)}${e.resolved?' · 恢复于 '+esc(e.resolved):''}</p>${e.ack?`<p>已确认于 ${esc(e.ack)}</p>`:''}</div>${e.ack?'<span class="small muted">已确认</span>':btn('确认异常','ack','',`data-id="${e.id}"`)}</article>`).join(''):empty('这里没有异常','当前筛选下没有事件。')}</div></div>`)}
function rulePage(){return card('告警规则','按容器负载、意外退出或节点失联建立规则。',state.empty||!rules.length?empty('还没有规则','创建一条规则，监视你关心的容器或节点。',btn('新建规则','new-rule','primary')):table('告警规则列表',['类型 / 对象','条件','状态','操作'],rules.map(r=>`<tr><td><strong>${kindNames[r.kind]}</strong><span class="sub">${esc(objectName(r.scope))}</span></td><td>${r.kind==='resource'?`${metrics.find(m=>m[0]===r.metric)?.[1]} &gt; ${esc(r.threshold)} · `:''}${esc(r.duration)} 秒</td><td>${pill(r.enabled?'启用':'已停用',r.enabled?'ok':'')}</td><td class="actions">${btn('编辑规则','edit-rule','quiet compact',`data-id="${r.id}"`)}${btn('删除规则','delete-rule','quiet compact',`data-id="${r.id}"`)}</td></tr>`).join('')),btn('新建规则','new-rule','primary'))}
function notificationPage(){return card('通知设置','告警触发和恢复时发送通知；测试也仅在原型中模拟。',`<div class="card-body"><dl class="facts"><div><dt>当前通知地址</dt><dd class="mono">${esc(webhook.configured?webhook.mask:'尚未配置')}</dd></div><div><dt>最近送达</dt><dd>${esc(webhook.last||'—')}</dd></div></dl><div class="row small muted" style="margin:20px 0">等待中 ${webhook.pending} · 已送达 ${webhook.delivered} · 失败 ${webhook.failed} · 已跳过 ${webhook.skipped}</div><form id="notification-form" class="stack" novalidate><div class="form-grid">${field('新的通知地址','webhook-url','','url','留空保持原地址；请勿输入真实凭据。','autocomplete="off" placeholder="https://…"')}${field('允许的内网网段','webhook-cidrs',webhook.cidrs,'text','多个网段用逗号分隔，仅填写信任的网段。')}</div><label class="check"><input type="checkbox" id="webhook-enabled" ${webhook.enabled?'checked':''}>启用通知</label><div id="notification-error"></div><div class="row"><button class="btn primary" type="submit">保存通知设置</button>${btn('发送测试通知','test-notification','',webhook.configured?'':'disabled')}</div></form></div>`)}
function settingsPage(){return header('设置','管理节点接入与管理员账户。')+tabs([['enroll','节点接入'],['nodes','节点管理'],['password','管理员密码']],state.settingsTab,'settings-tab','系统设置')+(state.settingsTab==='enroll'?enrollmentPage():state.settingsTab==='nodes'?card('已接入节点','撤销接入不会删除节点记录，也不会停止其容器。',state.empty?empty('还没有节点','先生成令牌完成接入。',btn('接入节点','to-enroll','primary')):table('节点管理列表',['主机名','连接状态','容器','最近活动','操作'],nodeRows(true)),btn('刷新','refresh','compact')):passwordPage())}
function enrollmentPage(){return card('接入新节点','一次性接入令牌 · 15 分钟内有效',`<div class="card-body"><div class="narrow-form">${state.token?notice('令牌只显示这一次，60 秒后自动隐藏。原型令牌不能用于真实接入。','warn'):'<p class="muted" style="margin-bottom:20px">生成令牌后，在目标节点上按以下步骤启动 Agent。</p>'}${state.token?`<div class="token-box"><code data-token>${esc(state.token)}</code><p class="small muted" style="margin-top:8px">有效期至 ${esc(new Date(state.tokenExpiry).toLocaleString())}<br><span data-token-count>60</span> 秒后从页面隐藏</p></div><div class="row">${btn('复制令牌','copy-token')}${btn('隐藏令牌','hide-token','quiet')}</div>`:btn('生成接入令牌','generate-token','primary')}<ol class="instruction" style="margin-top:24px"><li>把令牌写入节点文件，并将文件权限设为 0600。</li><li>用环境变量 HMOOB_ENROLLMENT_FILE 指向该文件。</li><li>启动 Agent，避免令牌进入命令历史。</li></ol><div class="token-box"><code>HMOOB_ENROLLMENT_FILE=/etc/hmoob/enrollment.txt hmoob-agent</code></div><p class="small muted">仅展示现有系统的接入方式，不在 URL 或命令参数中携带令牌。</p></div></div>`)}
function passwordPage(){return card('修改管理员密码','修改后所有会话失效，需要使用新密码登录。',`<div class="card-body"><form id="password-form" class="stack narrow-form" novalidate>${field('当前密码','current-password','','password','演示初始密码：demo-password；不要输入真实密码。','autocomplete="off"')}${field('新密码','new-password','','password','12–128 个字符。','autocomplete="off"')}${field('确认新密码','confirm-password','','password','','autocomplete="off"')}<div id="password-error"></div><div><button class="btn primary" type="submit">修改密码</button></div></form></div>`)}
function renderAuth(){const init=state.auth==='initialize';$('#root').innerHTML=`<div class="gate"><div class="gate-demo">${btn('演示场景','scenes','compact')}</div><section class="gate-card"><div class="brand"><span class="mark">${icon('cube')}</span><div><strong>hmoob dock</strong><small>轻量部署平台 · 交互原型</small></div></div><h1>${init?'初始化控制台':'登录控制台'}</h1><p class="muted small" style="margin-top:7px">${init?'使用初始化凭据创建唯一的管理员账户。':'使用管理员密码继续。'}</p>${state.authNotice?`<div style="margin-top:18px">${notice(esc(state.authNotice))}</div>`:''}<form id="auth-form" novalidate>${init?field('初始化凭据','bootstrap','','password','演示凭据：demo-bootstrap','autocomplete="off"'):''}${field('管理员密码','auth-password','','password',init?'12–128 个字符。':'演示初始密码：demo-password','autocomplete="off"')}${init?field('确认密码','auth-confirm','','password','','autocomplete="off"'):''}<div id="auth-error"></div><button class="btn primary" type="submit">${init?'创建管理员':'登录'}</button></form><p class="auth-note">仅模拟身份流程，不要输入真实密码或凭据。</p></section></div>`}
function openDialog(title,body,footer='',form=''){modalReturn=document.activeElement;const dialog=$('#dialog');dialog.innerHTML=`<div class="modal-head"><h2 id="dialog-title">${title}</h2><button class="icon-btn" type="button" data-action="close-modal" aria-label="关闭对话框">${icon('close')}</button></div>${form?`<form id="${form}" novalidate>`:''}<div class="modal-body">${body}</div>${footer?`<div class="modal-foot">${footer}</div>`:''}${form?'</form>':''}`;dialog.showModal()}
function closeDialog(){const dialog=$('#dialog');if(dialog.open)dialog.close();dialog.innerHTML='';modalReturn?.isConnected&&modalReturn.focus()}
function modalError(text){$('#modal-error').innerHTML=notice(esc(text),'bad')}
function createForm(){openDialog('新建应用',`<div class="stack">${field('应用名称','app-name','','text')}${selectField('部署模式','app-mode',[['compose','Compose'],['swarm','Swarm']],'compose')}<div id="target-field">${selectField('目标节点','app-target',[['','请选择节点'],...nodes.filter(n=>!n.revoked).map(n=>[n.id,n.name])],nodes.find(n=>!n.revoked)?.id || '')}</div>${field('命名空间','app-namespace','','text','Compose 项目名或 Swarm Stack 名，只能使用小写字母、数字、- 和 _。')}<p class="small muted">模式创建后不能更改。</p><label class="check"><input type="checkbox" id="app-adopt">我确认接管该命名空间下已有的资源</label><div id="modal-error"></div></div>`,btn('取消','close-modal')+'<button class="btn primary" type="submit">创建应用</button>','create-form')}
function ruleForm(rule=null){openDialog(rule?'编辑规则':'新建规则',`<div class="stack">${selectField('规则类型','rule-kind',Object.entries(kindNames),rule?.kind||'resource')}${field('监视对象','rule-scope',rule?.scope||'','text','填写容器 ID；节点失联规则填写节点 ID。')}<div id="resource-fields" class="stack" ${(rule?.kind && rule.kind!=='resource')?'hidden':''}>${selectField('监控指标','rule-metric',metrics.map(m=>[m[0],m[0]==='cpu_percent'?'CPU（每核 100%）':m[1]+'（字节'+(m[0]==='memory_bytes'?'':'/秒')+'）']),rule?.metric||'cpu_percent')}${field('阈值','rule-threshold',rule?.threshold||0,'number','持续超过此值时开启告警。','step="any" min="0"')}</div>${field('持续时间（秒）','rule-duration',rule?.duration||0,'number','0 表示立即开启。','min="0" step="1"')}<label class="check"><input id="rule-enabled" type="checkbox" ${rule?.enabled===false?'':'checked'}>启用这条规则</label><input type="hidden" id="rule-id" value="${rule?.id||''}"><div id="modal-error"></div></div>`,btn('取消','close-modal')+'<button class="btn primary" type="submit">保存规则</button>','rule-form')}
function scenes(){openDialog('演示场景',`<p class="small muted">以下入口仅用于设计走查，不属于正式系统功能。不会发起真实请求。</p><div class="scenario-title">数据与连接</div><div class="scenario-grid">${[['normal','正常数据'],['empty','空数据'],['error','请求失败'],['offline','连接中断'],['stale','数据过期'],['metricGap','采样缺口'],['logGap','日志缺口']].map(([id,label])=>btn(label,'scene','',`data-id="${id}"`)).join('')}</div><div class="scenario-title">配置与部署</div><div class="scenario-grid">${[['conflict','配置冲突'],['danger','服务删除与风险'],['failed','部署失败'],['uncertain','状态待确认'],['partial','部分更新'],['rollback','目标已回滚'],['notifyFail','通知发送失败']].map(([id,label])=>btn(label,'scene','',`data-id="${id}"`)).join('')}</div><div class="scenario-title">账户与令牌</div><div class="scenario-grid">${[['initialize','首次初始化'],['expired','会话过期'],['hideToken','令牌显示超时'],['reset','重置全部演示']].map(([id,label])=>btn(label,'scene','',`data-id="${id}"`)).join('')}</div>`)}
function applyScene(id){closeDialog();if(id==='reset'){location.reload();return}if(id==='initialize'||id==='expired'){stopLogs();hideToken(false);state.auth=id==='initialize'?'initialize':'login';state.authNotice=id==='expired'?'会话已过期，请重新登录。':'';render();return}if(id==='hideToken'){hideToken();toast('令牌已从页面隐藏；不代表令牌已到期。');return}state.error=false;state.empty=false;state.offline=false;state.stale=false;if(id==='normal'){state.logGap=false;state.metricGap=false;state.previewDanger=false;state.nextResult='succeeded';state.notificationFail=false}else if(['empty','error','offline','stale','logGap','metricGap'].includes(id)){state[id]=true;if(id==='logGap'&&!logLines.length)logLines=['[模拟] …前面的日志缺失…']}else if(id==='notifyFail'){state.notificationFail=true;state.route='alerts';state.alertTab='notifications'}else{state.route='detail';const a=currentApp();if(!a)return;if(id==='conflict'){state.tab='config';a.conflict=a.saved.replace('1.27','1.28');a.preview=null}else if(id==='danger'){state.tab='config';state.previewDanger=true;a.preview=null}else{stopAppJob(a);a.task={id:'task-demo-'+id,state:id==='partial'||id==='rollback'?'failed':id,at:stamp(),output:'[模拟] 目标连接发生变化，执行结果需要核对。',partial:id==='partial',rolledBack:id==='rollback'};a.selectedTask=a.task;state.tab='overview'}}render()}
function stopAppJob(a){jobTimers.filter(j=>j.app===a.id).forEach(j=>clearTimeout(j.timer));jobTimers=jobTimers.filter(j=>j.app!==a.id)}
function serviceNames(yaml){const block=yaml.match(/^services:\s*\n([\s\S]*)/m)?.[1]||'';const out=[];for(const line of block.split('\n')){if(/^\S/.test(line)&&!line.startsWith('#'))break;const match=line.match(/^  ([a-zA-Z0-9_-]+):\s*(?:#.*)?$/);if(match)out.push(match[1])}return out}
function preview(a){a.removal=false;a.risk=false;const names=serviceNames(a.draft);let error='';if(!a.draft.trim())error='YAML 配置不能为空。';else if(a.draft.includes('\t'))error='YAML 缩进不能使用 Tab，请改为空格。';else if(!names.length)error='第 1 行：缺少 services 或服务缩进不正确，请使用两空格缩进。';else if((a.draft.match(/\[/g)||[]).length!==(a.draft.match(/\]/g)||[]).length)error='配置中存在未闭合的方括号，请检查对应行。';const required=[...a.draft.matchAll(/\$\{([A-Za-z_][A-Za-z0-9_]*)\}/g)].map(m=>m[1]);const missing=required.filter(n=>!a.variables[n]);if(missing.length)error='变量未设置：'+missing.join('、');if(a.conflict)error='服务端配置已更新，请先处理版本冲突。';a.preview=error?{error}:{fingerprint:fingerprint(a),removed:state.previewDanger?['legacy-worker']:serviceNames(a.saved).filter(n=>!names.includes(n)),risks:state.previewDanger||/privileged:\s*true/.test(a.draft)?['配置包含高权限运行项，可能扩大对目标节点的访问范围。']:[],error:''};render()}
function deploy(a){if(!canDeploy(a))return;const versionID='v-demo-'+String(++counter).padStart(3,'0');const task={id:'task-demo-'+counter,state:'queued',at:stamp(),output:'[模拟] 部署已排队。',partial:false,rolledBack:false};a.task=a.selectedTask=task;a.latest=versionID;a.saved=a.draft;a.savedVariables={...a.variables};a.loadedVersion='';const version={id:versionID,at:stamp(),yaml:a.draft,variables:{...a.variables},taskID:task.id,state:'queued'};a.versions.unshift(version);a.preview=null;const outcome=state.nextResult;state.previewDanger=false;toast('部署已提交（模拟），不会操作真实容器。');render();['preflight','running','verifying',outcome].forEach((phase,i)=>{const timer=setTimeout(()=>{task.state=version.state=phase;task.output+='\n'+(phase==='running'?'Container '+a.namespace+'-1 Recreate':phase==='succeeded'?'Container '+a.namespace+'-1 Started\n服务已达到目标状态。':taskNames[phase]);if(phase==='succeeded'){a.successful=versionID;if(a.mode==='compose'&&!appContainers(a).length)containers.push({id:'container-demo-'+counter,node:a.target,name:a.namespace+'-web-1',namespace:a.namespace,service:'web',image:'nginx:1.27-alpine',status:'running',health:''})}if(state.auth==='signed-in' && state.route==='detail'&&state.appID===a.id){if(state.tab==='config'){updateConfigHint(a);const status=$('[data-task-status]');if(status)status.textContent=taskNames[phase]}else render()}if(i===3){jobTimers=jobTimers.filter(j=>j.app!==a.id);if(state.auth==='signed-in')render()}},650*(i+1));jobTimers.push({app:a.id,timer})})}
function stopLogs(){if(logTimer)clearInterval(logTimer);logTimer=null;following=true}
function startLogs(){if(logTimer)return;const c=containers.find(c=>c.id===state.containerID);if(!c)return;if(!connected(nodes.find(n=>n.id===c.node))){toast('连接中断，暂时无法打开容器实时日志。');return}logLines=Array.from({length:24},(_,i)=>`[模拟] ${new Date().toISOString()} GET / HTTP/1.1 200 · request ${i+1}`);following=true;logTimer=setInterval(()=>{logLines.push(`[模拟] ${new Date().toISOString()} GET /health HTTP/1.1 200`);if(logLines.length>5000){logLines=logLines.slice(-5000);state.logGap=true}const box=$('[data-live-log]');if(box){box.textContent=logLines.map(x=>x.length>2000?x.slice(0,2000)+'…（本行过长，已截断）':x).join('\n');if(following)box.scrollTop=box.scrollHeight}},950);render();const box=$('[data-live-log]');if(box)box.scrollTop=box.scrollHeight}
function hideToken(redraw=true){clearInterval(tokenTimer);tokenTimer=null;state.token='';state.tokenExpiry=state.tokenHide=0;if(redraw)render()}
function generateToken(){state.token='demo-'+Array.from(crypto.getRandomValues(new Uint8Array(16)),v=>v.toString(16).padStart(2,'0')).join('');state.tokenExpiry=Date.now()+900000;state.tokenHide=Date.now()+60000;render();clearInterval(tokenTimer);tokenTimer=setInterval(()=>{const seconds=Math.max(0,Math.ceil((state.tokenHide-Date.now())/1000));if(seconds===0){hideToken();return}if($('[data-token-count]'))$('[data-token-count]').textContent=seconds},250)}
function refresh(){state.loading=true;render();clearTimeout(renderTimer);renderTimer=setTimeout(()=>{state.loading=false;state.error=false;nodes.forEach(n=>{if(connected(n))n.last=stamp()});render();toast('已刷新演示数据。')},450)}
function confirmDialog(title,text,action,id){openDialog(title,`<p>${text}</p><div id="modal-error"></div>`,btn('取消','close-modal')+btn(action==='confirm-revoke'?'确认撤销':'确认删除',action,'danger',`data-id="${esc(id)}"`))}
function snapshotTask(a,v){if(a.task?.id===v.taskID)return a.task;return {id:v.taskID,state:v.state,output:`[模拟] ${v.id}\nContainer ${a.namespace}-1 Started\n部署完成。`,at:v.at}}
const actions={
 navigate:el=>nav(el.dataset.id), 'to-apps':()=>nav('applications'), 'open-app':el=>nav('detail',el.dataset.id,'overview'),
 'app-tab':el=>{if(el.dataset.id!=='containers')stopLogs();state.tab=el.dataset.id;render()},'alert-tab':el=>{state.alertTab=el.dataset.id;render()},'event-filter':el=>{state.filter=el.dataset.id;render()},'settings-tab':el=>{if(el.dataset.id!=='enroll')hideToken(false);state.settingsTab=el.dataset.id;render()},
 'to-enroll':()=>{state.settingsTab='enroll';nav('settings')},'config-tab':()=>{state.tab='config';render()},'history-tab':()=>{state.tab='history';render()},
 scenes,'scene':el=>applyScene(el.dataset.id),'close-modal':closeDialog,refresh,retry:()=>{state.error=false;refresh()},
 'create-app':createForm,'new-rule':()=>ruleForm(),'edit-rule':el=>ruleForm(rules.find(r=>r.id===el.dataset.id)),
 logout:()=>{stopLogs();hideToken(false);state.auth='login';state.authNotice='';render()},
 'node-curve':el=>{state.nodeID=el.dataset.id;state.curve=false;render();const cardEl=$('.chart-wrap')||$('.toolbar');if(cardEl)window.scrollTo({top:cardEl.getBoundingClientRect().top+window.scrollY-140,behavior:'smooth'})},
 curve:()=>{state.curve=true;drawCharts();render()}, preview:()=>preview(currentApp()),deploy:()=>deploy(currentApp()),
 'add-variable':()=>{const a=currentApp(),name=$('#var-name').value.trim(),value=$('#var-value').value;if(!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)){$('#variable-error').innerHTML=notice('变量名应由字母、数字和下划线组成，且不能以数字开头。','bad');return}a.variables[name]=value;render();toast('变量已暂存。预览后随配置提交。')},
 'remove-variable':el=>{delete currentApp().variables[el.dataset.name];render()},
 'reload-config':()=>{const a=currentApp();if(a.draft!==a.saved||JSON.stringify(a.variables)!==JSON.stringify(a.savedVariables)){a.conflict=a.saved;render();toast('检测到未提交编辑，请选择保留或使用服务端配置。')}else toast('已是最近提交的配置。')},
 'use-server':()=>{const a=currentApp();a.saved=a.conflict;a.draft=a.saved;a.variables={...a.savedVariables};a.loadedVersion='';a.conflict=null;a.preview=null;render()},'keep-draft':()=>{const a=currentApp();if(a.conflict)a.saved=a.conflict;a.conflict=null;a.preview=null;render()},
 redeploy:el=>{const a=currentApp();if(blocking(a.task))return;const v=a.versions.find(v=>v.id===el.dataset.id);a.draft=v.yaml;a.variables={...v.variables};a.loadedVersion=v.id;a.preview=null;state.tab='config';preview(a);toast('已载入历史配置。重新部署不会恢复已经删除的数据。')},
 'version-output':el=>{const a=currentApp(),v=a.versions.find(v=>v.id===el.dataset.id);a.selectedTask=snapshotTask(a,v);state.tab='logs';render()},
 'task-output':()=>{const a=currentApp();a.selectedTask=a.task;state.tab='logs';stopLogs();render()},
 reconcile:()=>{toast('核对后结果仍未知（模拟）。请确认执行端停止后再释放。')},
 resolve:()=>openDialog('人工核对并释放',`${notice('释放不代表部署成功，只解除后续提交的阻塞。请先在执行端确认操作已停止。','warn')}<div class="stack"><label class="check"><input id="resolve-stopped" type="checkbox">我已确认执行端不再继续操作</label>${field('释放原因','resolve-reason')}<div id="modal-error"></div></div>`,btn('取消','close-modal')+'<button type="submit" class="btn danger">确认释放</button>','resolve-form'),
 'open-logs':startLogs,'close-logs':()=>{stopLogs();render()},follow:()=>{following=true;const b=$('[data-live-log]');b.scrollTop=b.scrollHeight;$('#follow-button').hidden=true},
 ack:el=>{const e=events.find(e=>e.id===el.dataset.id);if(!e.ack)e.ack=stamp();render();toast('已确认异常。仍需等待实际状态恢复。')},
 'delete-rule':el=>confirmDialog('删除告警规则','删除后不再触发新告警，已有事件记录仍然保留。','confirm-delete-rule',el.dataset.id),
 'confirm-delete-rule':el=>{rules=rules.filter(r=>r.id!==el.dataset.id);closeDialog();render();toast('规则已删除，事件记录已保留。')},
 revoke:el=>confirmDialog('撤销节点接入',`确认撤销 ${esc(nodeName(el.dataset.id))} 的凭据？连接将断开，但不停止容器、不删除历史记录。`,'confirm-revoke',el.dataset.id),
 'confirm-revoke':el=>{const n=nodes.find(n=>n.id===el.dataset.id);n.connected=false;n.revoked=true;closeDialog();render();toast('接入凭据已撤销（模拟）。')},
 'generate-token':generateToken,'hide-token':()=>hideToken(),
 'copy-token':async()=>{try{await navigator.clipboard.writeText(state.token);toast('演示令牌已复制。')}catch{toast('浏览器未允许复制，请手动选择令牌。')}},
 'test-notification':()=>{if(!webhook.configured)return;if(!webhook.enabled){toast('通知已停用，请先启用并保存。');return}if(state.notificationFail){webhook.failed++;render();$('#notification-error').innerHTML=notice('测试通知发送失败（模拟）：目标未响应。检查地址后可再次测试。','bad');state.notificationFail=false}else{webhook.delivered++;webhook.last=stamp();render();toast('测试通知已送达（模拟，未发送任何网络请求）。')}}
};
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const action=actions[el.dataset.action];if(!action)return;event.preventDefault();action(el)});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='yaml'){const a=currentApp();a.draft=el.value;updateConfigHint(a);$('.line-numbers').textContent=a.draft.split('\n').map((_,i)=>i+1).join('\n')}if(el.id==='confirm-removal'){currentApp().removal=el.checked;updateConfigHint(currentApp())}if(el.id==='confirm-risk'){currentApp().risk=el.checked;updateConfigHint(currentApp())}});
document.addEventListener('change',event=>{const el=event.target;if(el.dataset.variable && el.value!==''){currentApp().variables[el.dataset.variable]=el.value;el.value='';updateConfigHint(currentApp());toast('变量新值已暂存。')}if(el.id==='app-mode'){$('#target-field').innerHTML=el.value==='compose'?selectField('目标节点','app-target',nodes.filter(n=>!n.revoked).map(n=>[n.id,n.name]),nodes.find(n=>!n.revoked)?.id||''):field('集群标识','app-target','','text','填写已有 Swarm 集群 ID。')}if(el.id==='rule-kind'){$('#resource-fields').hidden=el.value!=='resource';$('#rule-scope').nextElementSibling.textContent=el.value==='agent_offline'?'填写节点 ID，失联超过持续时间后开启告警。':'填写容器 ID，规则不以整台机器为范围。'}if(el.id==='curve-node'){state.nodeID=el.value;state.curve=false;stopLogs();render()}if(el.id==='curve-container'){state.containerID=el.value;state.curve=false;stopLogs();render()}if(el.id==='curve-metric'){state.metric=el.value;state.curve=false;render()}if(el.id==='curve-range'){state.range=el.value;state.curve=false;render()}if(el.id==='output-task'){const a=currentApp(),v=a.versions.find(v=>v.taskID===el.value);a.selectedTask=snapshotTask(a,v);render()}});
document.addEventListener('focusout',event=>{if(event.target.id==='app-name' && !$('#app-namespace').value)$('#app-namespace').value=event.target.value.trim().toLowerCase().replace(/[^a-z0-9_-]+/g,'-').replace(/^[^a-z0-9]+/,'').slice(0,63)});
document.addEventListener('scroll',event=>{if(event.target.matches?.('[data-live-log]')){const el=event.target;following=el.scrollHeight-el.scrollTop-el.clientHeight<8;$('#follow-button').hidden=following}},true);
document.addEventListener('keydown',event=>{if(event.target.id==='yaml'&&event.key==='Tab'){event.preventDefault();event.target.setRangeText('  ',event.target.selectionStart,event.target.selectionEnd,'end');event.target.dispatchEvent(new Event('input',{bubbles:true}))}});
$('#dialog').addEventListener('cancel',event=>{event.preventDefault();closeDialog()});
window.addEventListener('resize',()=>{clearTimeout(renderTimer);renderTimer=setTimeout(drawCharts,120)});
document.addEventListener('submit',event=>{event.preventDefault();const form=event.target.id;
 if(form==='create-form'){const name=$('#app-name').value.trim(),mode=$('#app-mode').value,target=$('#app-target').value.trim(),namespace=$('#app-namespace').value.trim();if(!name)return modalError('请填写应用名称。');if(!target)return modalError(mode==='swarm'?'请填写集群标识。':'请选择目标节点。');if(!/^[a-z0-9][a-z0-9_-]{0,62}$/.test(namespace))return modalError('命名空间仅允许小写字母、数字、- 和 _，长度最多 63。');if(applications.some(a=>a.target===target&&a.namespace===namespace))return modalError('此目标的命名空间已由应用管理。');if(containers.some(c=>c.node===target&&c.namespace===namespace)&&!$('#app-adopt').checked)return modalError('命名空间已有资源，需要明确确认接管。');const a=makeApp('app-demo-'+(++counter),name,mode,namespace,target);applications.push(a);state.empty=false;closeDialog();nav('detail',a.id,'config');toast('应用已创建，接下来编写配置。')}
 if(form==='rule-form'){const kind=$('#rule-kind').value,scope=$('#rule-scope').value.trim(),threshold=Number($('#rule-threshold').value),duration=Number($('#rule-duration').value);if(!scope)return modalError('请填写监视对象。');if(kind==='resource'&&(!Number.isFinite(threshold)||threshold<=0))return modalError('阈值必须大于零。');if(!Number.isInteger(duration)||duration<0)return modalError('持续时间必须为非负整数。');const id=$('#rule-id').value||'rule-demo-'+(++counter);const r={id,kind,scope,metric:kind==='resource'?$('#rule-metric').value:'',threshold:kind==='resource'?threshold:0,duration,enabled:$('#rule-enabled').checked};const index=rules.findIndex(r=>r.id===id);if(index<0)rules.push(r);else rules[index]=r;state.empty=false;closeDialog();render();toast('规则已保存。')}
 if(form==='resolve-form'){if(!$('#resolve-stopped').checked||!$('#resolve-reason').value.trim())return modalError('请确认执行端已经停止，并填写释放原因。');const a=currentApp();if(a.task?.state!=='uncertain')return modalError('部署状态已变化，请重新核对。');a.task.state='failed';a.task.output+='\n人工释放：'+$('#resolve-reason').value.trim();closeDialog();render();toast('已完成模拟核对并解除部署阻塞。')}
 if(form==='notification-form'){const value=$('#webhook-url').value.trim(),cidrs=$('#webhook-cidrs').value.trim();let url;if(value){try{url=new URL(value);if(url.protocol!=='https:')throw Error()}catch{$('#notification-error').innerHTML=notice('请输入有效的 HTTPS 通知地址。','bad');return}}const entries=cidrs.split(/[\s,]+/).filter(Boolean);if(entries.some(c=>!validCIDR(c))){$('#notification-error').innerHTML=notice('网段格式不正确，请输入有效 CIDR，如 10.0.0.0/8。','bad');return}if(!webhook.configured&&!url){$('#notification-error').innerHTML=notice('请先填写通知地址。','bad');return}if(url){webhook.mask=url.origin+'/***';webhook.configured=true}webhook.cidrs=entries.join(', ');webhook.enabled=$('#webhook-enabled').checked;render();toast('通知设置已保存（仅当前演示）。')}
 if(form==='password-form'){const old=$('#current-password').value,next=$('#new-password').value,confirm=$('#confirm-password').value;let error=next!==confirm?'两次输入的密码不一致。':next.length<12||next.length>128?'新密码长度必须为 12–128 个字符。':old!==state.password?'当前密码不正确。':'';if(error){$('#password-error').innerHTML=notice(error,'bad');return}state.password=next;state.auth='login';state.authNotice='密码已修改，所有会话已失效，请使用新密码登录。';stopLogs();hideToken(false);render()}
 if(form==='auth-form'){const password=$('#auth-password').value,init=state.auth==='initialize';let error='';if(init){if($('#bootstrap').value!=='demo-bootstrap')error='初始化凭据无效或已过期。';else if(password.length<12||password.length>128)error='密码长度必须为 12–128 个字符。';else if(password!==$('#auth-confirm').value)error='两次输入的密码不一致。'}else if(password!==state.password)error='密码不正确，请重试。';if(error){$('#auth-error').innerHTML=notice(error,'bad');return}if(init){state.password=password;state.auth='login';state.authNotice='管理员已创建，请登录。';render()}else{state.auth='signed-in';state.authNotice='';nav('overview')}}
});
function validCIDR(entry){const [ip,prefix,...rest]=entry.split('/');if(rest.length||!/^\d+$/.test(prefix||''))return false;const n=Number(prefix);if(ip.includes(':')){if(!/^[0-9a-f:.]+$/i.test(ip)||n>128)return false;try{return new URL('https://['+ip+']/').hostname.startsWith('[')}catch{return false}}const parts=ip.split('.');return parts.length===4&&parts.every(p=>/^\d{1,3}$/.test(p)&&Number(p)<=255)&&n<=32}
const initial=location.hash.slice(1).split('/');if(['overview','applications','alerts','settings'].includes(initial[0]))state.route=initial[0];if(initial[0]==='applications'&&initial[1]&&applications.some(a=>a.id===initial[1])){state.route='detail';state.appID=initial[1];state.tab=['overview','containers','logs','config','history'].includes(initial[2])?initial[2]:'overview'}
render();
</script>
</body>
